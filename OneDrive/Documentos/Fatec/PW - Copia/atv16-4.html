<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 04</title>
</head>
<body>
    <p>Formulário para saber qual mês você iria querer ter 2 semanas de férias</p>
 
    <fieldset>
        <legend>Preencha esses dados:</legend>
    <form action="" method="post" autocomplete="on">
        <p><label>Primeiro nome:
            <input type="text" name="" id="pri_nome"
            placeholder="Digite o primeiro nome:"> (Primeiro Nome)
        </label>
    </p>
    <p><label>Ultimo Nome:
        <input type="text" name="" id="ult_nome"
        placeholder="Digite o Ultimo Nome:"> (ultimo Nome)
    </label></p>
    <p>
        <label>Digite seu email:
            <input type="email" name="" id="email"
            placeholder="nome@dominio.com.br">(nome@dominio.com.br)
        </label>
    </p>
    </fieldset>
    <p><label for="txtList">Escolha um mês que você gostaria de ter 2 semanas de férias
        <input type="text" name="" id="txtList"
        placeholder="Selecione um mês" list="meses">
    <datalist id="meses">
        <option value="Janeiro"></option>
        <option value="Fevereiro"></option>
        <option value="Março"></option>
        <option value="Abril"></option>
        <option value="Maio"></option>
        <option value="Junho"></option>
        <option value="Julho"></option>
        <option value="Agosto"></option>
        <option value="Setembro"></option>
        <option value="Outubro"></option>
        <option value="Novembro"></option>
        <option value="Dezembro"></option>
    </datalist> </label></p>
    <p><input type="submit" value="Enviar">
    <input type="reset" value="Cancelar"></p>
    </form>
</body>
</html>
