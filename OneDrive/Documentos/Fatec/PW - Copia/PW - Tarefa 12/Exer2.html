<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Ficha de Atividades</title>
</head>
<body>
    <form action="#" method="post">
        <div>
            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome">
        </div>
        <div>
            <label for="altura">Altura (cm):</label>
            <input type="text" id="altura" name="altura">
        </div>
        <div>
            <label for="peso">Peso (kg):</label>
            <input type="text" id="peso" name="peso">
        </div>
        <div>
            <p>Gênero:</p>
            <input type="radio" id="masculino" name="genero" value="Masculino">
            <label for="masculino">Masculino</label>
            <input type="radio" id="feminino" name="genero" value="Feminino">
            <label for="feminino">Feminino</label>
        </div>
        <div>
            <p>Atividades:</p>
            <input type="checkbox" name="atividades" value="Academia"> Academia
            <input type="checkbox" name="atividades" value="Caminhada"> Caminhada
            <input type="checkbox" name="atividades" value="Ciclismo"> Ciclismo
            <input type="checkbox" name="atividades" value="Natação"> Natação
            <input type="checkbox" name="atividades" value="Lutas"> Lutas
            <input type="checkbox" name="atividades" value="Dança"> Dança
        </div>
        <div>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </div>
    </form>
</body>
</html>
