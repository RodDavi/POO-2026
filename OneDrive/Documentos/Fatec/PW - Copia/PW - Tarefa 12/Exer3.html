<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastro Fatec Franca</title>
</head>
<body>
    <form action="#" method="post">
        <div>
            <label for="nome">Nome Completo:</label>
            <input type="text" id="nome" name="nome">
        </div>
        <div>
            <label for="curso">Curso:</label>
            <select name="curso" id="curso">
                <option value="ADS">Análise e Desenvolvimento de Sistemas</option>
                <option value="GTI">Gestão da Tecnologia da Informação</option>
                <option value="LOG">Logística</option>
                <option value="ADM">Administração</option>
            </select>
        </div>
        <div>
            <label for="matricula">Número de Matrícula:</label>
            <input type="text" id="matricula" name="matricula">
        </div>
        <div>
            <label for="periodo">Período:</label>
            <input type="radio" name="periodo" value="Manhã"> Manhã
            <input type="radio" name="periodo" value="Noite"> Noite
        </div>
        <div>
            <textarea name="observacoes" rows="4" cols="36">Digite suas observações aqui...</textarea>
        </div>
        <div>
            <input type="submit" value="Cadastrar">
            <input type="reset" value="Limpar">
        </div>
    </form>
</body>
</html>
