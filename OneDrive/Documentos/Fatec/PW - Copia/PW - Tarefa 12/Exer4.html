<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Login Simples</title>
    <style>
        body {
            background-color: #111;
            color: #eee;
            font-family: Arial, sans-serif;
            padding: 30px;
        }
 
        form {
            background-color: #222;
            padding: 20px;
            border-radius: 8px;
            width: 300px;
        }
 
        input[type="text"] {
            padding: 6px;
            border: none;
            border-radius: 4px;
            width: 100%;
            margin-bottom: 10px;
        }
 
        button {
            background-color: #28a745;
            color: #fff;
            border: none;
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
        }
 
        button:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>
    <form action="#" method="post">
        <label for="usuario">Nome de Usuário:</label>
        <input type="text" id="usuario" name="usuario">
        <button type="submit">Enviar</button>
    </form>
</body>
</html>
