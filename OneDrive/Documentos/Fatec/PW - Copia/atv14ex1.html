<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exe1</title>
    <link rel="stylesheet" href="ex1.css">
</head>
<body>
    <style>
    .wrapper {
  font-size: 1.5em;
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
}
 
.box {
  background-color: lightblue;
  border: 5px solid darkblue;
  padding: 10px;
  margin: 1em 0;
  text-align: center;
}
 
.px {
  width: 300px;
}
 
.vw {
  width: 10vw;
}
 
.em {
  width: 10em;
}
</style>
    <div class="wrapper">
    <div class="box px">Tamanho de 300px</div>
    <div class="box vw">Tamanho de 10vw</div>
    <div class="box em">Tamanho de 10em</div>
  </div>
</body>
