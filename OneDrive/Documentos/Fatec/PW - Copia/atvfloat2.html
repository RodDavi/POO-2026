<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Exe4</title>
  <style>
    @media screen {
      body {
        background-color: steelblue;
        color: white;
        font-family: Arial, sans-serif;
        padding: 20px;
      }
 
      h1 {
        font-size: 24pt;
      }
 
      p {
        font-size: 14pt;
      }
    }
 
    @media print {
      body {
        background-color: white;
        color: black;
        font-family: 'Times New Roman', Times, serif;
        padding: 20px;
      }
 
      h1 {
        color: black;
        font-size: 18pt;
      }
 
      p {
        font-size: 12pt;
      }
    }
  </style>
</head>
<body>
  <h1>Exemplo de Media type em CSS</h1>
  <p>As Media Types definem para qual tipo de dispositivo o estilo será direcionado.</p>
  <ul>
    <li>Screen: monitores e telas em geral.</li>
    <li>Print: para impressão em papel.</li>
    <li>Braille: para dispositivos táteis.</li>
    <li>Projection: para apresentações.</li>
  </ul>
</body>
</html>
