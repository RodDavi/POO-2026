<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Datalist e Autocomplete</title>
    <style>
        body {
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            background-color: darksalmon;
            
        }
        input {
            background-color: rgb(251, 17, 99);   
        }

        img {
            float: right;
            margin-top: 0em;
        }
    </style>
</head>
<body>
    <img src="santos.jpeg" alt="Escudo do Santos">
    <h1> Formulário de DataList e Autocomplete</h1>
    <p> Esse formulário demonstra o atributo Autocomplete e o elemento Datalist</p>
    <form action="www.fatecfranca.edu.br" method="get" autocomplete="on">
        <p>
            <label> Primeiro nome:
                <input type="text" placeholder="Digite Primeiro nome">
            </label> (Primeiro Nome)
        </p>
    <p>
        <label>Último nome: <br>
            <input type="text" placeholder="Digite Último nome">
        </label> (Último Nome)
    </p>
    <p>
        <label>Digite seu time do coração: <br>
            <input type="email" required>
        </label>
    </p>
    <p>
        <label for="txtList"> Maior Time do Brasil:
            <input type="text" name="" id="txtList"
            placeholder="Selecione um time" list="times" required>
            <datalist id="times">
                <option value="Palmeiras"></option>
                <option value="Flamengo"></option>
                <option value="Santos"></option>
                <option value="Corinthians"></option>
                <option value="São Paulo"></option>
                <option value="Grêmio"></option>
                <option value="Internacional"></option>
                <option value="Vasco"></option>
                <option value="Fluminense"></option>
                <option value="Botafogo"></option>
                <option value="Cruzeiro"></option>
                <option value="Atlético-MG"></option>
            </datalist>
        </label>
    </p>
        <input type="submit"></input>
        <input type="reset"></input>
</p>
</form>
</body>
</html>
