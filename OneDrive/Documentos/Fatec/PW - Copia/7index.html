<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela simples</title>
</head>
<body>
    <table border="1">
        <caption> Preço de doces </caption>
    <tfoot>
        <thead>
            <tr>
            <th> doce </th>
            <th> preço </th>
            </tr>
        </thead>
    </tfoot>
    <tbody>
            <tr>
                <td> paçoca </td>
                <td> R$1,00 </td>
            </tr>

            <tr>
                <td> jujbas </td>
                <td> R$ 1,00 </td>
            </tr>
            <tr>
                <td> kitkat </td>
                <td> R$4,50 </td>
            </tr>
            <tr>
                <td>kinder ovo</td>
                <td> R$10,50</td>
            </tr>
    </tbody>
    </table>
</body>
</html>
